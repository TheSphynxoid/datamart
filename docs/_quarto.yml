project:
  type: default
  output-dir: _render
  render:
    - documentation-technique.md
    - guide-utilisation.md

format:
  typst:
    toc: true
    number-sections: true
    lang: fr
    papersize: a4
    margin-x: 2.2cm
    margin-y: 2.4cm
    fontsize: 11pt
    header-includes: |
      // Thème par défaut : stroke: none + un seul trait sous l'en-tête.
      // show-set : plus prioritaire que le set global du thème, donc chaque
      // table reçoit des traits horizontaux entre les lignes (x: none = pas
      // de barres verticales).
      #show table: set table(stroke: (x: none, y: 0.5pt), inset: 6pt)
      // Une table ne se coupe plus entre deux pages : elle bascule entière
      // sur la page suivante si elle n'a pas la place de finir.
      #show table: set block(breakable: false)

language:
  crossref-sec-prefix: "§"
